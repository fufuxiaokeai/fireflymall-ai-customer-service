server:
  host: 0.0.0.0
  port: 8000

logging:
  level: 'DEBUG'
  file_path: './log'
  formatter: '%(asctime)s [%(threadName)s - %(thread)d] %(levelname)s %(filename)s [%(funcName)s/%(lineno)d] %(message)s'
  create_file: true
  max_bytes: 5MB
  backup_count: 2

redis:
  host: localhost
  port: 6379
  password: '123456'
  db: 0
  max_connections: 20

AMQP:
  rabbitmq:
    username: fufu
    password: '123456'
    host: 192.168.152.135
    port: 5672
    virtual_host: /
    heartbeat: 600
    connection_attempts: 3
    retry_delay: 5

file:
  upload_dir: './data/uploads'
  download_dir: './data/downloads'

model:
  name: 'deepseek-v4-flash'      # token 计算用模型名（不在白名单时退化为 字数/3.3 粗略计算）
  # huggingface_id: 'Qwen/Qwen2.5-7B-Instruct'   # 可选：HF 分词器 id，更精确的 token 计数
  params:
    temperature: 0.8
    extra_body:
      thinking:
        type: 'disabled'
  vision:
    name: 'qwen3.7-plus'
  vocation: # 记忆中间件使用场景（BalancedMultiDimensionMemory 读取）
    name: 'customer service'      # collaborative creation / customer service / accompany / customize
    # kwargs: {...}               # 仅 customize 模式需要，自定义 _VOCATION_PARAM_MAP 之外的参数
  summary: # 记忆总结 / 参数调优用的 LLM
    name: 'deepseek-v4-flash'
    kwargs:
      temperature: 1.3
      extra_body:
        thinking:
          type: 'disabled'
      profile:
        max_input_tokens: 12800    # 该值是记录模型的最大token数，不是允许的最大token数
    pattern: 'fraction'            # fraction / tokens / messages 三选一
    trigger_threshold: 0.8         # messages 模式：消息条数阈值（>=50）；tokens 模式：token 数；fraction 模式：0~1


huggingface:
  mirror: true
  download_dir: ./huggingface_cache

databases:
  mysql:
    host: localhost
    port: 3306
    user: root
    password: '123456'
    db: fireflymall
  postgres:
    host: localhost
    port: 5432
    user: postgres
    password: '123456'
    db: fireflymall
  rag:
    sqlite:
      db_url: './database/test1.db'
    es:
      db_url: 'http://server:9200'
      index_name: 'goods'
      username: 'elastic'
      password: '123456'
    milvus:
      collection_name: firefly_mall_faq
      primary_field: pk
      metadata_field: metadata
      text_field: text
      conn_args:
        uri: http://server:19530
        token: root:Milvus
        db_name: firefly_mall
      index_params:
        index_type: IVF_FLAT
        metric_type: COSINE
        params:
          nlist: 128
      search_params:
        metric_type: COSINE
        params:
          nprobe: 10
      level: Strong
      drop_old: false

# 邮箱配置，用于发送一些错误信息
email:
  smtp: 'smtp.qq.com'
  port: 465
  sender: '1516415510@qq.com'
  sender_name: '不知道'
  receiver:
    - '1516415510@qq.com'
